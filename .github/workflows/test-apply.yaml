name: test-apply

on:
  schedule:
    # 02:00 UTC daily. Scheduled runs only fire from the default branch.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      action_make_target:
        description: "AutoGlue action make_target to run after apply"
        type: string
        required: false
        default: "setup"
      gluekube_docker_tag:
        description: "GlueKube docker tag to test (defaults to examples/test/variables.tf)"
        type: string
        required: false

permissions:
  contents: read

# Serialize runs: they share one Proxmox cluster and one AutoGlue org (same cluster-name
# secret), and the pre-run nukes delete by that name. Two overlapping runs would tear down
# each other's VMs mid-apply. Queue rather than cancel, so a run is never killed between
# apply and teardown.
concurrency:
  group: test-apply
  cancel-in-progress: false

jobs:
  test-apply:
    runs-on: ubuntu-latest
    # Backstop only: invoke_autoglue.sh gives up on its own at 45m with a message naming
    # the last status. This stops a hang elsewhere from burning the 6h default.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/test
    env:
      # verbatim (tofu parses TF_VAR_ for complex types as an HCL expression). The secret
      # holds the whole object, so optional attributes it omits keep their type defaults.
      TF_VAR_provider_credentials: ${{ secrets.PROVIDER_CREDENTIALS }}
      # Waggle: endpoint/api_key configure the waggle provider, datacenter_id is passed
      # through to the node pools and bastion. All three are required in practice here,
      # since every node pool in main.tf sets waggle_slot_name.
      TF_VAR_waggle_endpoint: ${{ secrets.WAGGLE_ENDPOINT }}
      TF_VAR_waggle_api_key: ${{ secrets.WAGGLE_API_KEY }}
      TF_VAR_waggle_datacenter_id: ${{ secrets.WAGGLE_DATACENTER_ID }}
      # AutoGlue integration
      TF_VAR_autoglue_cluster_name: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}
      TF_VAR_autoglue_key: ${{ secrets.AUTOGLUE_KEY }}
      TF_VAR_autoglue_org_secret: ${{ secrets.AUTOGLUE_ORG_SECRET }}
      TF_VAR_autoglue_base_url: ${{ secrets.AUTOGLUE_BASE_URL }}
      # Route53 config
      TF_VAR_route53_aws_access_key_id: ${{ secrets.ROUTE53_AWS_ACCESS_KEY_ID }}
      TF_VAR_route53_aws_secret_access_key: ${{ secrets.ROUTE53_AWS_SECRET_ACCESS_KEY }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
      TF_VAR_autoglue_credential_id: ${{ secrets.AUTOGLUE_CREDENTIAL_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      # Needed by autoglue_nuke.py (the post-destroy cleanup step). setup-python gives a
      # pip that is not externally-managed, so `pip install requests` works cleanly.
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set GlueKube docker tag
        if: ${{ inputs.gluekube_docker_tag != '' }}
        env:
          TAG: ${{ inputs.gluekube_docker_tag }}
        run: echo "TF_VAR_gluekube_docker_tag=${TAG}" >> "$GITHUB_ENV"

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          args: "--exit-node=${{ secrets.TAILSCALE_EXIT_NODE }}  --accept-dns=false"
          tags: tag:github-actions
      
      - name: Pre-Nuke AutoGlue org
        if: ${{ always() }}
        continue-on-error: true
        env:
          AUTOGLUE_BASE_URL: ${{ secrets.AUTOGLUE_BASE_URL }}
          AUTOGLUE_ORG_KEY: ${{ secrets.AUTOGLUE_KEY }}
          AUTOGLUE_ORG_SECRET: ${{ secrets.AUTOGLUE_ORG_SECRET }}
        run: |
          python -m pip install --quiet requests
          python autoglue_nuke.py

      - name: Pre-Nuke Proxmox resources
        if: ${{ always() }}
        continue-on-error: true
        env:
          PROXMOX_PROVIDER_CREDENTIALS: ${{ secrets.PROVIDER_CREDENTIALS }}
          PROXMOX_CLUSTER_NAME: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}
        run: |
          python -m pip install --quiet requests
          python proxmox_nuke.py

      - name: Tofu init
        run: tofu init

      - name: Tofu apply
        run: tofu apply -auto-approve

      - name: Invoke AutoGlue kubernetes setup
        env:
          BASE_URL: ${{ secrets.AUTOGLUE_BASE_URL }}
          API_KEY: ${{ secrets.AUTOGLUE_API_KEY }}
          ORG_NAME: ${{ secrets.AUTOGLUE_ORG_NAME }}
          CLUSTER_NAME: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}
          # inputs is empty on scheduled runs, so fall back to the dispatch default.
          ACTION_MAKE_TARGET: ${{ inputs.action_make_target || 'setup' }}
        run: bash invoke_autoglue.sh

      - name: Check cluster health
        env:
          BASE_URL: ${{ secrets.AUTOGLUE_BASE_URL }}
          API_KEY: ${{ secrets.AUTOGLUE_API_KEY }}
          ORG_NAME: ${{ secrets.AUTOGLUE_ORG_NAME }}
        run: bash check_cluster_health.sh

      # Teardown always runs, so no run can leave the shared state or the cluster behind.
      # continue-on-error keeps a partial/failed destroy from blocking the nukes below.
      - name: Tofu destroy
        continue-on-error: true
        if: ${{ always() }}
        run: tofu destroy -auto-approve

      # Backstop cleanup: delete any AutoGlue org resources left behind after destroy.
      # always() so leftovers are still cleaned even if apply or destroy failed partway.
      - name: Nuke AutoGlue org
        if: ${{ always() }}
        env:
          AUTOGLUE_BASE_URL: ${{ secrets.AUTOGLUE_BASE_URL }}
          AUTOGLUE_ORG_KEY: ${{ secrets.AUTOGLUE_KEY }}
          AUTOGLUE_ORG_SECRET: ${{ secrets.AUTOGLUE_ORG_SECRET }}
        run: |
          python -m pip install --quiet requests
          python autoglue_nuke.py

      # Backstop cleanup: force-delete any Proxmox VMs tagged with the cluster name and
      # any leftover cloud-init snippets. Same always() rationale as the AutoGlue nuke.
      # The whole provider_credentials object (JSON or HCL) is passed through; the script
      # extracts endpoint/api_token/insecure itself. Reaches Proxmox over the Tailscale
      # exit node set up above.
      - name: Nuke Proxmox resources
        if: ${{ always() }}
        env:
          PROXMOX_PROVIDER_CREDENTIALS: ${{ secrets.PROVIDER_CREDENTIALS }}
          PROXMOX_CLUSTER_NAME: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}
        run: |
          python -m pip install --quiet requests
          python proxmox_nuke.py
