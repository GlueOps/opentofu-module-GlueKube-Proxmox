name: test-apply

on:
  schedule:
    # 02:00 UTC daily. Scheduled runs only fire from the default branch.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      action_make_target:
        description: "AutoGlue action make_target to run after apply"
        type: string
        required: false
        default: "setup"
      gluekube_docker_tag:
        description: "GlueKube docker tag to test (defaults to examples/test/variables.tf)"
        type: string
        required: false

permissions:
  contents: read

# Serialize runs: they share one Proxmox cluster and one AutoGlue org (same cluster-name
# secret), and the pre-run nukes delete by that name. Two overlapping runs would tear down
# each other's VMs mid-apply. Queue rather than cancel, so a run is never killed between
# apply and teardown.
concurrency:
  group: test-apply
  cancel-in-progress: false

jobs:
  test-apply:
    runs-on: ubuntu-latest
    # Backstop only: invoke_autoglue.sh gives up on its own at 45m with a message naming
    # the last status. This stops a hang elsewhere from burning the 6h default.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: examples/test
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          # Pinned so an OpenTofu release cannot break the nightly on a day nobody
          # touched the code — an unpinned break presents as a module regression and
          # costs a day of chasing the wrong cause. Bump deliberately.
          tofu_version: "1.12.5"

      # Python is no longer set up here: the nuke-* actions own actions/setup-python
      # and install their own pinned requests, so the caller carries no Python setup.

      - name: Set GlueKube docker tag
        if: ${{ inputs.gluekube_docker_tag != '' }}
        env:
          TAG: ${{ inputs.gluekube_docker_tag }}
        run: echo "TF_VAR_gluekube_docker_tag=${TAG}" >> "$GITHUB_ENV"

      - name: Setup Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          args: "--exit-node=${{ secrets.TAILSCALE_EXIT_NODE }}  --accept-dns=false"
          tags: tag:github-actions
      

      # Pre-flight clean slate. Not continue-on-error and not always(): if we cannot
      # prove the org and the Proxmox cluster are empty before applying, the health
      # check downstream can pass against leftovers from a previous run instead of
      # the cluster this run built. Failing here is cheaper than a false green.
      - name: Pre-Nuke AutoGlue org
        uses: GlueOps/github-actions-gluekube-e2e/nuke-autoglue@66f2febb1c31b6a8a75f1fb35b38c9765d327169 # v0.0.1
        with:
          base-url: ${{ secrets.AUTOGLUE_BASE_URL }}
          org-key: ${{ secrets.AUTOGLUE_KEY }}
          org-secret: ${{ secrets.AUTOGLUE_ORG_SECRET }}

      - name: Pre-Nuke Proxmox resources
        uses: GlueOps/github-actions-gluekube-e2e/nuke-proxmox@66f2febb1c31b6a8a75f1fb35b38c9765d327169 # v0.0.1
        with:
          provider-credentials: ${{ secrets.PROVIDER_CREDENTIALS }}
          cluster-name: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}

      - name: Tofu init
        run: tofu init

      # KEEP IN SYNC with the identical block on `Tofu destroy` below. Destroy has to
      # re-evaluate the same provider configuration, so a variable added here and not
      # there breaks teardown rather than apply.
      - name: Tofu apply
        env:
          # verbatim (tofu parses TF_VAR_ for complex types as an HCL expression). The secret
          # holds the whole object, so optional attributes it omits keep their type defaults.
          TF_VAR_provider_credentials: ${{ secrets.PROVIDER_CREDENTIALS }}
          # Waggle: endpoint/api_key configure the waggle provider, datacenter_id is passed
          # through to the node pools and bastion. All three are required in practice here,
          # since every node pool in main.tf sets waggle_slot_name.
          TF_VAR_waggle_endpoint: ${{ secrets.WAGGLE_ENDPOINT }}
          TF_VAR_waggle_api_key: ${{ secrets.WAGGLE_API_KEY }}
          TF_VAR_waggle_datacenter_id: ${{ secrets.WAGGLE_DATACENTER_ID }}
          # AutoGlue integration
          TF_VAR_autoglue_cluster_name: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}
          TF_VAR_autoglue_key: ${{ secrets.AUTOGLUE_KEY }}
          TF_VAR_autoglue_org_secret: ${{ secrets.AUTOGLUE_ORG_SECRET }}
          TF_VAR_autoglue_base_url: ${{ secrets.AUTOGLUE_BASE_URL }}
          # Route53 config
          TF_VAR_route53_aws_access_key_id: ${{ secrets.ROUTE53_AWS_ACCESS_KEY_ID }}
          TF_VAR_route53_aws_secret_access_key: ${{ secrets.ROUTE53_AWS_SECRET_ACCESS_KEY }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
          TF_VAR_autoglue_credential_id: ${{ secrets.AUTOGLUE_CREDENTIAL_ID }}
        run: tofu apply -auto-approve

      - name: Invoke AutoGlue kubernetes setup
        uses: GlueOps/github-actions-gluekube-e2e/invoke-autoglue@66f2febb1c31b6a8a75f1fb35b38c9765d327169 # v0.0.1
        with:
          base-url: ${{ secrets.AUTOGLUE_BASE_URL }}
          api-key: ${{ secrets.AUTOGLUE_API_KEY }}
          org-name: ${{ secrets.AUTOGLUE_ORG_NAME }}
          cluster-name: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}
          # inputs is empty on scheduled runs, so fall back to the dispatch default.
          # The action guards this again internally, since GitHub does not apply an
          # input default to a value that is present but empty.
          action-make-target: ${{ inputs.action_make_target || 'setup' }}

      - name: Check cluster health
        uses: GlueOps/github-actions-gluekube-e2e/check-cluster-health@66f2febb1c31b6a8a75f1fb35b38c9765d327169 # v0.0.1
        with:
          base-url: ${{ secrets.AUTOGLUE_BASE_URL }}
          api-key: ${{ secrets.AUTOGLUE_API_KEY }}
          org-name: ${{ secrets.AUTOGLUE_ORG_NAME }}
          # Restricts the bastion/master lookup to THIS run's cluster, so a leftover
          # cluster from a previous run cannot be checked instead. The pre-flight
          # nukes above are the primary isolation guarantee; this is the backstop.
          cluster-name: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}

      # Teardown always runs, so no run can leave the cluster behind. continue-on-error
      # keeps a partial/failed destroy from blocking the nukes below, which are what
      # actually guarantee cleanup here.
      #
      # A failed destroy does NOT fail the job. It is known to fail intermittently
      # against this stack, and with no remote state the nukes are the teardown
      # mechanism of record — destroy is best-effort, the nukes are the guarantee.
      # The "Teardown verdict" step still reports the failure as a warning so it is
      # visible rather than silent; what turns the job red is a nuke failing.
      - name: Tofu destroy
        id: destroy
        continue-on-error: true
        if: ${{ always() }}
        # KEEP IN SYNC with the identical block on `Tofu apply` above.
        env:
          TF_VAR_provider_credentials: ${{ secrets.PROVIDER_CREDENTIALS }}
          TF_VAR_waggle_endpoint: ${{ secrets.WAGGLE_ENDPOINT }}
          TF_VAR_waggle_api_key: ${{ secrets.WAGGLE_API_KEY }}
          TF_VAR_waggle_datacenter_id: ${{ secrets.WAGGLE_DATACENTER_ID }}
          TF_VAR_autoglue_cluster_name: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}
          TF_VAR_autoglue_key: ${{ secrets.AUTOGLUE_KEY }}
          TF_VAR_autoglue_org_secret: ${{ secrets.AUTOGLUE_ORG_SECRET }}
          TF_VAR_autoglue_base_url: ${{ secrets.AUTOGLUE_BASE_URL }}
          TF_VAR_route53_aws_access_key_id: ${{ secrets.ROUTE53_AWS_ACCESS_KEY_ID }}
          TF_VAR_route53_aws_secret_access_key: ${{ secrets.ROUTE53_AWS_SECRET_ACCESS_KEY }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
          TF_VAR_autoglue_credential_id: ${{ secrets.AUTOGLUE_CREDENTIAL_ID }}
        run: tofu destroy -auto-approve

      # Backstop cleanup: delete any AutoGlue org resources left behind after destroy.
      # always() so leftovers are still cleaned even if apply or destroy failed partway.
      # Deliberately NOT continue-on-error: with no remote state, the nukes are the only
      # teardown guarantee, so a nuke that fails must turn the job red on its own.
      - name: Nuke AutoGlue org
        id: nuke_autoglue
        if: ${{ always() }}
        uses: GlueOps/github-actions-gluekube-e2e/nuke-autoglue@66f2febb1c31b6a8a75f1fb35b38c9765d327169 # v0.0.1
        with:
          base-url: ${{ secrets.AUTOGLUE_BASE_URL }}
          org-key: ${{ secrets.AUTOGLUE_KEY }}
          org-secret: ${{ secrets.AUTOGLUE_ORG_SECRET }}

      # Backstop cleanup: force-delete any Proxmox VMs tagged with the cluster name and
      # any leftover cloud-init snippets. Same always() rationale as the AutoGlue nuke.
      # The whole provider_credentials object (JSON or HCL) is passed through; the script
      # extracts endpoint/api_token/insecure itself. Reaches Proxmox over the Tailscale
      # exit node set up above.
      - name: Nuke Proxmox resources
        id: nuke_proxmox
        if: ${{ always() }}
        uses: GlueOps/github-actions-gluekube-e2e/nuke-proxmox@66f2febb1c31b6a8a75f1fb35b38c9765d327169 # v0.0.1
        with:
          provider-credentials: ${{ secrets.PROVIDER_CREDENTIALS }}
          cluster-name: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}

      # Last step in the job, so every teardown path above has already run.
      #
      # What this step is for: teardown used to be able to fail completely while the job
      # stayed green, and you found out from the Proxmox bill. It reports every teardown
      # outcome into the step summary so nothing is silent.
      #
      # What turns the job RED is cleanup not having happened — i.e. a nuke failing.
      # A failed `tofu destroy` on its own does NOT, because:
      #   - it fails intermittently against this stack, and a nightly that goes red for
      #     an expected failure trains people to ignore red, which is worse than the
      #     failure itself;
      #   - with no remote state (#402) the nukes are the teardown mechanism of record.
      #     Destroy is best-effort; the nukes are the guarantee.
      # It is still surfaced as a ::warning:: annotation, so it shows on the run without
      # being fatal — invisible is what we were fixing, not non-fatal.
      #
      # The cases:
      #   nukes ok, destroy ok      -> green, clean
      #   nukes ok, destroy failed  -> green with a warning. Nothing is left running.
      #   a nuke failed             -> RED. Possibly live orphaned infrastructure, and
      #                                if destroy failed too, almost certainly.
      - name: Teardown verdict
        if: ${{ always() }}
        env:
          DESTROY: ${{ steps.destroy.outcome }}
          NUKE_AUTOGLUE: ${{ steps.nuke_autoglue.outcome }}
          NUKE_PROXMOX: ${{ steps.nuke_proxmox.outcome }}
        run: |
          set -euo pipefail

          # Anything that is not "success" counts as not cleaned up, including "skipped":
          # a nuke that never ran has proved nothing about what is left behind.
          nukes_ok=true
          if [ "$NUKE_AUTOGLUE" != "success" ] || [ "$NUKE_PROXMOX" != "success" ]; then
            nukes_ok=false
          fi

          {
            echo "### Teardown"
            echo ""
            echo "| Step | Outcome | Fails the job? |"
            echo "| --- | --- | --- |"
            echo "| tofu destroy | \`${DESTROY}\` | no — best-effort |"
            echo "| nuke AutoGlue org | \`${NUKE_AUTOGLUE}\` | yes |"
            echo "| nuke Proxmox resources | \`${NUKE_PROXMOX}\` | yes |"
            echo ""
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

          if [ "$nukes_ok" = true ]; then
            if [ "$DESTROY" = "success" ]; then
              echo "Teardown clean: destroy succeeded and both nukes came back empty."
            else
              echo "::warning title=tofu destroy did not succeed::'tofu destroy' did not succeed (outcome: ${DESTROY}), but both nukes then ran clean, so nothing should be left running. Not failing the job: destroy is best-effort here and the nukes are the teardown mechanism of record."
              echo "Teardown completed via the nukes; 'tofu destroy' outcome was '${DESTROY}'."
            fi
            exit 0
          fi

          if [ "$DESTROY" != "success" ]; then
            echo "ERROR: teardown FAILED and the nukes did not clean up after it" >&2
            echo "(destroy: ${DESTROY}, autoglue: ${NUKE_AUTOGLUE}, proxmox: ${NUKE_PROXMOX})." >&2
            echo "There is very likely live orphaned infrastructure in Proxmox and/or the" >&2
            echo "AutoGlue org right now. Check both by hand before re-running." >&2
            exit 1
          fi

          echo "ERROR: 'tofu destroy' succeeded but a nuke did not (autoglue: ${NUKE_AUTOGLUE}, proxmox: ${NUKE_PROXMOX})." >&2
          echo "Resources the nuke could not delete may still exist. Check the failing nuke's log." >&2
          exit 1
