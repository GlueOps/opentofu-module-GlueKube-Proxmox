name: test-apply

on:
  schedule:
    # 02:00 UTC daily. Scheduled runs only fire from the default branch.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      action_make_target:
        description: "AutoGlue action make_target to run after apply"
        type: string
        required: false
        default: "setup"
      gluekube_docker_tag:
        description: "GlueKube docker tag to test (defaults to examples/test/variables.tf)"
        type: string
        required: false

permissions:
  contents: read

# Serialize runs: they share one Proxmox cluster and one AutoGlue org (same cluster-name
# secret), and the pre-run nukes delete by that name. Two overlapping runs would tear down
# each other's VMs mid-apply. Queue rather than cancel, so a run is never killed between
# apply and teardown.
#
# The group is SHARED with test-upgrade.yaml, which drives the same cluster through the
# same e2e workflow — the two must serialize against each other, not just against
# themselves, so the name is deliberately not this workflow's own name. (Renaming it from
# "test-apply" means a run already queued under the old name will not serialize against
# the new one; a one-time window at rollout, not an ongoing risk.)
concurrency:
  group: gluekube-e2e
  cancel-in-progress: false

jobs:
  # The whole job lives in the reusable workflow, shared with test-upgrade. Leaving
  # upgrade_to_tag unset is what makes this the plain apply test: every upgrade step
  # there is gated on it.
  test-apply:
    uses: ./.github/workflows/e2e.yaml
    secrets: inherit
    with:
      gluekube_docker_tag: ${{ inputs.gluekube_docker_tag }}
      # inputs is empty on scheduled runs, so fall back to the dispatch default.
      action_make_target: ${{ inputs.action_make_target || 'setup' }}
